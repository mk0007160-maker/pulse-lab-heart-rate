name: Publish Pulse Lab APK direct download

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-android-release.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Download previously tested Android APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release
          gh run download 41289098510 --repo "$GITHUB_REPOSITORY" --name PulseLab-Android-APK --dir release
          test -s release/app-debug.apk
          mv release/app-debug.apk release/PulseLab_Android.apk

      - name: Publish direct-download release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0.0 release/PulseLab_Android.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target main \
            --title "Pulse Lab Android v1.0.0" \
            --notes "Installable Android APK (debug signed) for personal testing. The app includes the Pulse Lab heart-rate calculators and supports offline use. Android may ask you to authorize installation from your browser or file manager."
